<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnósticos - Assistify</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --olive-dark: #2B2F1D;
    --olive-med: #3F4323;
    --olive-light: #C7CCA8;
    --gold: #9A9959;
    --cream-dark: #ECE7D6;
    --cream: #F6F3EA;
    --white: #ffffff;
    --black-soft: #1A1A17;
    --gray-200: #e8e6e0;
    --gray-400: #9c9a94;
    --gray-600: #5c5a56;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--black-soft);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    max-width: 600px;
    text-align: center;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 3rem;
    color: var(--olive-dark);
    margin-bottom: 1rem;
  }

  .logo span {
    color: var(--gold);
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--olive-dark);
    margin-bottom: 1rem;
  }

  p {
    font-size: 1.1rem;
    line-height: 1.7;
    color: var(--gray-600);
    margin-bottom: 3rem;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 16px;
    padding: 2rem;
    text-decoration: none;
    transition: all 0.2s;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    border-color: var(--gold);
  }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--olive-dark);
    margin-bottom: 0.5rem;
  }

  .card-desc {
    font-size: 0.9rem;
    color: var(--gray-600);
    line-height: 1.6;
  }

</style>
</head>
<body>

<div class="container">
  <div class="logo">Assistify<span>.</span></div>
  <h1>Diagnósticos de Negocio</h1>
  <p>Descubrí dónde estás atrapado y cómo mejorar tu claridad financiera</p>

  <div class="cards">
    <a href="/modulo1" class="card">
      <div class="card-title">Módulo 1</div>
      <div class="card-desc">
        ¿Dónde estás atrapado?<br>
        Ejecutor, Gestor o Dueño
      </div>
    </a>

    <a href="/paso2" class="card">
      <div class="card-title">Paso 2</div>
      <div class="card-desc">
        ¿Dónde se va tu plata?<br>
        Claridad Financiera
      </div>
    </a>
  </div>
</div>

</body>
</html>
