<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Diagnósticos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --olive-dark: #2B2F1D;
    --olive-med: #3F4323;
    --olive-light: #C7CCA8;
    --gold: #9A9959;
    --cream-dark: #ECE7D6;
    --cream: #F6F3EA;
    --white: #ffffff;
    --black-soft: #1A1A17;
    --gray-200: #e8e6e0;
    --gray-400: #9c9a94;
    --gray-600: #5c5a56;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--black-soft);
    padding: 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--olive-dark);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--gray-400);
    margin-bottom: 2rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 1.5rem;
  }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--olive-dark);
  }

  .filters {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    align-items: end;
  }

  .filter-actions {
    display: flex;
    gap: 0.5rem;
    grid-column: span 2;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .filter-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--olive-dark);
  }

  select, input {
    padding: 0.5rem 0.75rem;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }

  select:focus, input:focus {
    border-color: var(--gold);
  }

  select.has-value, input.has-value {
    border-color: var(--olive-dark);
    background-color: rgba(159, 153, 89, 0.05);
  }

  button {
    padding: 0.5rem 1rem;
    background: var(--olive-dark);
    color: var(--white);
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: var(--olive-med);
  }

  .table-container {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    background: var(--cream-dark);
    padding: 1rem;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--olive-dark);
    border-bottom: 1px solid var(--gray-200);
  }

  td {
    padding: 1rem;
    border-bottom: 1px solid var(--gray-200);
    font-size: 0.88rem;
  }

  tr:hover {
    background: rgba(159, 153, 89, 0.05);
  }

  .badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-modulo1 {
    background: rgba(192, 57, 43, 0.1);
    color: #c0392b;
  }

  .badge-paso2 {
    background: rgba(15, 110, 86, 0.1);
    color: #0f6e56;
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--gray-400);
  }

  .empty {
    text-align: center;
    padding: 3rem;
    color: var(--gray-400);
  }

  .detail-btn {
    background: transparent;
    border: 1.5px solid var(--olive-dark);
    color: var(--olive-dark);
    padding: 0.35rem 0.75rem;
    font-size: 0.75rem;
  }

  .detail-btn:hover {
    background: var(--olive-dark);
    color: var(--white);
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: var(--white);
    border-radius: 16px;
    padding: 2rem;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: transparent;
    color: var(--gray-400);
    font-size: 1.5rem;
    padding: 0;
    width: 2rem;
    height: 2rem;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--olive-dark);
    margin-bottom: 1rem;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--gray-200);
  }

  .detail-label {
    font-weight: 600;
    color: var(--gray-600);
  }

  .detail-value {
    color: var(--black-soft);
  }
</style>
</head>
<body>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h1>Dashboard de Diagnósticos</h1>
      <p class="subtitle">Panel de administración - Assistify</p>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span id="user-email" style="font-size: 0.85rem; color: var(--gray-600);"></span>
      <button onclick="logout()" style="width: auto; padding: 0.5rem 1rem; background: transparent; border: 1.5px solid var(--gray-200); color: var(--gray-600);">
        Cerrar sesión
      </button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="stat-label" id="stat-total-label">Total Diagnósticos</div>
      <div class="stat-value" id="stat-total">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Módulo 1</div>
      <div class="stat-value" id="stat-modulo1">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Paso 2</div>
      <div class="stat-value" id="stat-paso2">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Hoy</div>
      <div class="stat-value" id="stat-hoy">-</div>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label class="filter-label">Tipo</label>
      <select id="filter-tipo" onchange="applyFilters()">
        <option value="">Todos</option>
        <option value="modulo1">Módulo 1</option>
        <option value="paso2">Paso 2</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Mes</label>
      <select id="filter-mes" onchange="applyFilters()">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Buscar email</label>
      <input type="text" id="filter-email" placeholder="usuario@email.com" />
    </div>
    <div class="filter-actions">
      <button onclick="applyFilters()" style="flex: 1;">Buscar</button>
      <button onclick="clearFilters()" style="flex: 1; background: transparent; border: 1.5px solid var(--gray-200); color: var(--gray-600);">Limpiar</button>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2 style="font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--olive-dark);">Listado de Diagnósticos</h2>
    <span id="result-count" style="font-size: 0.85rem; color: var(--gray-400);"></span>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Nivel</th>
          <th>Puntaje</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="7" class="loading">Cargando datos...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal" id="detail-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 class="modal-title">Detalle del Diagnóstico</h2>
    <div id="modal-detail"></div>
  </div>
</div>

<script>
const AUTHORIZED_EMAIL = 'virtualassist@assistify365.com';
let allDiagnosticos = [];

// 🔐 Verificar autenticación al cargar
async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    // No autenticado, redirigir a login
    window.location.href = 'login.html';
    return false;
  }

  if (session.user.email !== AUTHORIZED_EMAIL) {
    // Email no autorizado, cerrar sesión y redirigir
    await supabaseClient.auth.signOut();
    alert('Email no autorizado. Solo virtualassist@assistify365.com tiene acceso.');
    window.location.href = 'login.html';
    return false;
  }

  // Mostrar email del usuario
  document.getElementById('user-email').textContent = session.user.email;
  return true;
}

// 🚪 Cerrar sesión
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
}

async function loadDiagnosticos() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '<tr><td colspan="7" class="loading">Cargando datos...</td></tr>';

  try {
    // Cargar todos los diagnósticos
    const { data, error } = await supabaseClient
      .from('diagnosticos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error completo:', error);
      tbody.innerHTML = `<tr><td colspan="7" class="empty">Error: ${error.message}</td></tr>`;
      return;
    }

    allDiagnosticos = data || [];

    // Poblar selector de meses
    populateMonthFilter(allDiagnosticos);

    // Aplicar filtros
    applyFilters();

  } catch (error) {
    console.error('Error inesperado:', error);
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Error inesperado</td></tr>';
  }
}

function populateMonthFilter(data) {
  const monthSelect = document.getElementById('filter-mes');
  const months = new Set();

  data.forEach(d => {
    const date = new Date(d.created_at);
    const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    months.add(monthKey);
  });

  const sortedMonths = Array.from(months).sort().reverse();

  // Limpiar y repoblar opciones
  monthSelect.innerHTML = '<option value="">Todos los meses</option>';

  sortedMonths.forEach(monthKey => {
    const [year, month] = monthKey.split('-');
    const date = new Date(year, parseInt(month) - 1);
    const monthName = date.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
    const option = document.createElement('option');
    option.value = monthKey;
    option.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
    monthSelect.appendChild(option);
  });
}

function applyFilters() {
  const tbody = document.getElementById('table-body');
  const tipoSelect = document.getElementById('filter-tipo');
  const mesSelect = document.getElementById('filter-mes');
  const emailInput = document.getElementById('filter-email');

  const tipo = tipoSelect.value;
  const mes = mesSelect.value;
  const email = emailInput.value.trim().toLowerCase();

  let filtered = [...allDiagnosticos];

  // Filtrar por tipo
  if (tipo) {
    filtered = filtered.filter(d => d.tipo === tipo);
  }

  // Filtrar por mes
  if (mes) {
    const [year, month] = mes.split('-');
    filtered = filtered.filter(d => {
      const date = new Date(d.created_at);
      const recordMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      return recordMonth === mes;
    });
  }

  // Filtrar por email
  if (email) {
    filtered = filtered.filter(d => d.email && d.email.toLowerCase().includes(email));
  }

  // Indicadores visuales de filtros activos
  tipoSelect.classList.toggle('has-value', tipo !== '');
  mesSelect.classList.toggle('has-value', mes !== '');
  emailInput.classList.toggle('has-value', email !== '');

  // Actualizar estadísticas con datos filtrados
  updateStats(filtered);

  // Actualizar contador de resultados
  const resultCount = document.getElementById('result-count');
  if (tipo || mes || email) {
    resultCount.textContent = `Mostrando ${filtered.length} de ${allDiagnosticos.length} diagnósticos`;
  } else {
    resultCount.textContent = `${filtered.length} diagnósticos totales`;
  }

  // Renderizar tabla
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No hay diagnósticos que coincidan con los filtros</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(d => `
    <tr>
      <td>${new Date(d.created_at).toLocaleDateString('es-AR')}</td>
      <td><span class="badge badge-${d.tipo}">${d.tipo === 'modulo1' ? 'Módulo 1' : 'Paso 2'}</span></td>
      <td>${escapeHTML(d.nombre)}</td>
      <td>${escapeHTML(d.email)}</td>
      <td>${escapeHTML(d.nivel) || '-'}</td>
      <td>${parseInt(d.puntaje_total) || '-'}</td>
      <td><button class="detail-btn" onclick="showDetail('${escapeHTML(d.id)}')">Ver detalle</button></td>
    </tr>
  `).join('');
}

function updateStats(data) {
  const total = data.length;
  const modulo1 = data.filter(d => d.tipo === 'modulo1').length;
  const paso2 = data.filter(d => d.tipo === 'paso2').length;
  const hoy = data.filter(d => {
    const created = new Date(d.created_at);
    const today = new Date();
    return created.toDateString() === today.toDateString();
  }).length;

  // Actualizar label del total si hay filtros activos
  const mes = document.getElementById('filter-mes').value;
  const totalLabel = document.getElementById('stat-total-label');

  if (mes) {
    const [year, month] = mes.split('-');
    const date = new Date(year, parseInt(month) - 1);
    const monthName = date.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
    totalLabel.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
  } else if (data.length !== allDiagnosticos.length) {
    totalLabel.textContent = 'Resultados filtrados';
  } else {
    totalLabel.textContent = 'Total Diagnósticos';
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-modulo1').textContent = modulo1;
  document.getElementById('stat-paso2').textContent = paso2;
  document.getElementById('stat-hoy').textContent = hoy;
}

// Función auxiliar para escapar HTML y prevenir XSS
function escapeHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function showDetail(id) {
  const diagnostico = allDiagnosticos.find(d => d.id === id);
  if (!diagnostico) return;

  // Cargar respuestas
  const { data: respuestas, error } = await supabaseClient
    .from('respuestas')
    .select('*')
    .eq('diagnostico_id', id)
    .order('pregunta_index');

  // Escapar todos los valores que vienen de la BD
  const safe = {
    id: escapeHTML(diagnostico.id),
    nombre: escapeHTML(diagnostico.nombre),
    email: escapeHTML(diagnostico.email),
    antiguedad: escapeHTML(diagnostico.antiguedad),
    nivel: escapeHTML(diagnostico.nivel),
    puntaje_total: parseInt(diagnostico.puntaje_total) || 0,
    insight: escapeHTML(diagnostico.resultados?.insight)
  };

  const modalDetail = document.getElementById('modal-detail');
  modalDetail.innerHTML = `
    <div class="detail-row">
      <span class="detail-label">ID:</span>
      <span class="detail-value">${safe.id}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Tipo:</span>
      <span class="detail-value">${diagnostico.tipo === 'modulo1' ? 'Módulo 1' : 'Paso 2'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Nombre:</span>
      <span class="detail-value">${safe.nombre}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Email:</span>
      <span class="detail-value">${safe.email}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Antigüedad:</span>
      <span class="detail-value">${safe.antiguedad || 'No especificado'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Nivel:</span>
      <span class="detail-value">${safe.nivel || '-'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Puntaje:</span>
      <span class="detail-value">${safe.puntaje_total || '-'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Fecha:</span>
      <span class="detail-value">${new Date(diagnostico.created_at).toLocaleString('es-AR')}</span>
    </div>
    ${diagnostico.resultados ? `
      <div style="margin-top: 1.5rem;">
        <h3 style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--olive-dark);">Insight</h3>
        <p style="font-size: 0.85rem; line-height: 1.6; color: var(--gray-600);">${safe.insight || '-'}</p>
      </div>
    ` : ''}
    ${respuestas && respuestas.length > 0 ? `
      <div style="margin-top: 1.5rem;">
        <h3 style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--olive-dark);">Respuestas</h3>
        ${respuestas.map(r => `
          <div style="margin-bottom: 1rem; padding: 0.75rem; background: var(--cream); border-radius: 8px;">
            <div style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--gray-400); margin-bottom: 0.25rem;">${escapeHTML(r.bloque)}</div>
            <div style="font-size: 0.85rem; color: var(--black-soft);">${escapeHTML(r.respuesta_texto)}</div>
            <div style="font-size: 0.75rem; color: var(--gray-400); margin-top: 0.25rem;">Puntos: ${parseInt(r.puntos) || 0}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;

  document.getElementById('detail-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('active');
}

function clearFilters() {
  document.getElementById('filter-tipo').value = '';
  document.getElementById('filter-mes').value = '';
  document.getElementById('filter-email').value = '';
  applyFilters();
}

// Click fuera del modal para cerrar
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeModal();
  }
});

// Filtrar al presionar Enter en el campo de email
document.getElementById('filter-email').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    applyFilters();
  }
});

// Verificar autenticación y cargar datos
(async () => {
  const isAuthenticated = await checkAuth();
  if (isAuthenticated) {
    loadDiagnosticos();
  }
})();
</script>

</body>
</html>
