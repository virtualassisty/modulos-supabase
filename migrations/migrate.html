<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Migration - Formularios JSONB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      background: #f5f5f5;
      padding: 30px;
      border-radius: 8px;
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #output {
      background: #000;
      color: #0f0;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      margin-top: 20px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗄️ Database Migration</h1>
    <p>Esta página ejecutará la migración de la base de datos para crear las tablas <code>formularios</code> y <code>respuestas_formularios</code> con arquitectura JSONB.</p>

    <div class="warning">
      <strong>⚠️ Advertencia:</strong> Esta migración solo debe ejecutarse una vez. Si las tablas ya existen, algunas operaciones serán omitidas.
    </div>

    <button id="migrateBtn" onclick="runMigration()">🚀 Ejecutar Migración</button>
    <button id="testBtn" onclick="testDatabase()" style="background: #2196F3; display: none;">✅ Probar Base de Datos</button>

    <div id="output"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wzimcsxlpfkzvdieicil.supabase.co';
    const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6aW1jc3hscGZrenZkaWVpY2lsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDI5NDI2NCwiZXhwIjoyMDk5ODcwMjY0fQ.cTi-umEgxEwvS2Dg1r3LhQAQman8eBkNqnN3C3l_1SQ';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
    const output = document.getElementById('output');
    const migrateBtn = document.getElementById('migrateBtn');
    const testBtn = document.getElementById('testBtn');

    function log(message, type = 'info') {
      output.style.display = 'block';
      const timestamp = new Date().toLocaleTimeString();
      const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
      output.textContent += `[${timestamp}] ${prefix} ${message}\n`;
      output.scrollTop = output.scrollHeight;
    }

    async function runMigration() {
      migrateBtn.disabled = true;
      output.textContent = '';
      log('Iniciando migración de base de datos...');

      try {
        // Step 1: Create formularios table
        log('Creando tabla formularios...');
        const { error: error1 } = await supabase.rpc('exec_sql', {
          query: `
            CREATE TABLE IF NOT EXISTS formularios (
              id TEXT PRIMARY KEY,
              nombre TEXT NOT NULL,
              created_at TIMESTAMPTZ DEFAULT NOW()
            )
          `
        });

        if (error1 && !error1.message.includes('already exists')) {
          log(`Error en formularios: ${error1.message}`, 'error');
        } else {
          log('Tabla formularios ✓', 'success');
        }

        // Step 2: Create respuestas_formularios table
        log('Creando tabla respuestas_formularios...');
        const { error: error2 } = await supabase.rpc('exec_sql', {
          query: `
            CREATE TABLE IF NOT EXISTS respuestas_formularios (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              formulario_id TEXT NOT NULL,
              email TEXT NOT NULL,
              nombre TEXT NOT NULL,
              respuestas JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMPTZ DEFAULT NOW()
            )
          `
        });

        if (error2 && !error2.message.includes('already exists')) {
          log(`Error en respuestas_formularios: ${error2.message}`, 'error');
        } else {
          log('Tabla respuestas_formularios ✓', 'success');
        }

        // Step 3: Insert initial forms
        log('Insertando definiciones de formularios...');
        const { error: error3 } = await supabase
          .from('formularios')
          .upsert([
            { id: 'diagnostico_financiero', nombre: 'Diagnóstico Financiero' },
            { id: 'diagnostico_roles', nombre: 'Diagnóstico de Roles' },
            { id: 'inventario_semanal', nombre: 'Inventario Semanal M2' },
            { id: 'diagnostico_delegacion', nombre: 'Diagnóstico de Delegación M2' },
          ], { onConflict: 'id' });

        if (error3) {
          log(`Error insertando formularios: ${error3.message}`, 'error');
        } else {
          log('Formularios insertados ✓', 'success');
        }

        // Step 4: Verify
        log('\nVerificando tablas...');
        const { data: forms, error: error4 } = await supabase
          .from('formularios')
          .select('*');

        if (error4) {
          log(`Error verificando: ${error4.message}`, 'error');
        } else {
          log(`Se encontraron ${forms.length} formularios:`, 'success');
          forms.forEach(f => log(`  - ${f.id}: ${f.nombre}`));
        }

        log('\n✅ ¡Migración completada exitosamente!', 'success');
        testBtn.style.display = 'inline-block';

      } catch (error) {
        log(`Error inesperado: ${error.message}`, 'error');
      } finally {
        migrateBtn.disabled = false;
      }
    }

    async function testDatabase() {
      log('\n🧪 Probando inserción de datos...');

      const testData = {
        formulario_id: 'diagnostico_financiero',
        email: 'test@example.com',
        nombre: 'Usuario de Prueba',
        respuestas: {
          pregunta1: 'Respuesta de prueba 1',
          pregunta2: 'Respuesta de prueba 2',
          puntaje: 85
        }
      };

      const { data, error } = await supabase
        .from('respuestas_formularios')
        .insert([testData])
        .select();

      if (error) {
        log(`Error en prueba: ${error.message}`, 'error');
      } else {
        log('✅ Datos insertados correctamente:', 'success');
        log(JSON.stringify(data[0], null, 2));
      }
    }
  </script>
</body>
</html>
