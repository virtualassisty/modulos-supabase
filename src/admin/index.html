<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Respuestas Formularios</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --navy: #1e2d5a;
  --teal: #00c9a0;
  --olive: #6b7a3a;
  --cream: #f7f4ef;
  --white: #fff;
  --gray-100: #f5f5f5;
  --gray-200: #e8e6e0;
  --gray-400: #9c9a94;
  --gray-600: #5c5a56;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--navy);
  padding: 2rem;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

header {
  background: var(--navy);
  color: white;
  padding: 1.5rem 2rem;
  border-radius: 12px;
  margin-bottom: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header > div:first-child {
  flex: 1;
}

h1 {
  font-size: 1.75rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.subtitle {
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.95rem;
}

.filters {
  background: white;
  padding: 1.5rem;
  border-radius: 10px;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.filter-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.filter-input,
.filter-select {
  padding: 0.7rem 1rem;
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  transition: border-color 0.2s;
}

.filter-input:focus,
.filter-select:focus {
  outline: none;
  border-color: var(--teal);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  padding: 1.25rem;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.stat-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gray-400);
  margin-bottom: 0.5rem;
}

.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--navy);
}

.table-wrapper {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: var(--navy);
  color: white;
}

th {
  padding: 1rem;
  text-align: left;
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

tbody tr {
  transition: all 0.2s;
}

tbody tr:hover {
  background: var(--gray-100);
  transform: scale(1.01);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

td {
  padding: 1rem;
  border-bottom: 1px solid var(--gray-200);
  font-size: 0.9rem;
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: none;
}

.badge {
  display: inline-block;
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}

.badge-financiero {
  background: #e6faf6;
  color: #00a882;
}

.badge-roles {
  background: #fff8ec;
  color: #ba7517;
}

.badge-inventario {
  background: #f0f2f8;
  color: #6b7a9a;
}

.badge-delegacion {
  background: #fff0f0;
  color: #e24b4a;
}

.json-preview {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  color: var(--gray-600);
  cursor: pointer;
}

.json-preview:hover {
  color: var(--teal);
}

.view-btn {
  background: var(--teal);
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.view-btn:hover {
  background: #00a882;
  transform: translateY(-1px);
}

.answer-grid {
  display: grid;
  gap: 1.25rem;
  margin-top: 1rem;
}

.answer-item {
  background: var(--gray-100);
  padding: 1rem;
  border-radius: 8px;
  border-left: 3px solid var(--teal);
}

.answer-label {
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
}

.answer-value {
  color: var(--gray-600);
  line-height: 1.6;
  font-size: 0.95rem;
}

.answer-value a {
  transition: all 0.2s;
}

.answer-value a:hover {
  opacity: 0.8;
  text-decoration: underline;
}

.answer-value ul {
  list-style-type: disc;
}

.answer-value li {
  padding: 0.15rem 0;
}

.metadata-section {
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 2px solid var(--gray-200);
}

.metadata-title {
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 1rem;
  font-size: 1rem;
}

.export-btn {
  background: var(--olive);
  color: white;
  border: none;
  padding: 0.6rem 1.25rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  margin-left: 1rem;
  transition: all 0.2s;
}

.export-btn:hover {
  background: #5a6832;
  transform: translateY(-1px);
}

.loading {
  text-align: center;
  padding: 3rem;
  color: var(--gray-400);
}

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.btn {
  padding: 0.75rem 1.5rem;
  background: var(--teal);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn:hover {
  background: #00a882;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 12px;
  padding: 2rem;
  max-width: 900px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.modal-content::-webkit-scrollbar {
  width: 8px;
}

.modal-content::-webkit-scrollbar-track {
  background: var(--gray-100);
  border-radius: 4px;
}

.modal-content::-webkit-scrollbar-thumb {
  background: var(--gray-400);
  border-radius: 4px;
}

.modal-content::-webkit-scrollbar-thumb:hover {
  background: var(--gray-600);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--gray-200);
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--navy);
}

.close-btn {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--gray-400);
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}

.close-btn:hover {
  background: var(--gray-100);
  color: var(--navy);
}

pre {
  background: var(--gray-100);
  padding: 1rem;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.85rem;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>🗄️ Panel de Administración Unificado</h1>
      <p class="subtitle">Todos los formularios — Sistema JSONB</p>
    </div>
    <!-- User info will be injected here by JavaScript -->
  </header>

  <div class="filters">
    <div class="filter-group">
      <label class="filter-label">Nombre</label>
      <input type="text" id="filter-nombre" class="filter-input" placeholder="Buscar por nombre...">
    </div>
    <div class="filter-group">
      <label class="filter-label">Email</label>
      <input type="email" id="filter-email" class="filter-input" placeholder="Buscar por email...">
    </div>
    <div class="filter-group">
      <label class="filter-label">Tipo de formulario</label>
      <select id="filter-tipo" class="filter-select">
        <option value="">Todos los formularios</option>
        <optgroup label="Assistify (Sistema Antiguo)">
          <option value="diagnostico_paso1">Recurso gratuito negocios – Paso 1</option>
          <option value="diagnostico_paso2">Recurso gratuito negocios – Paso 2</option>
          <option value="operaciones_saludables">Recurso gratuito OS</option>
        </optgroup>
        <optgroup label="Entregables (Sistema Nuevo)">
          <option value="diagnostico_financiero">Diagnóstico Financiero</option>
          <option value="diagnostico_roles">Diagnóstico de Roles</option>
          <option value="inventario_semanal">Inventario Semanal</option>
          <option value="diagnostico_delegacion">Diagnóstico de Delegación</option>
        </optgroup>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Fecha desde</label>
      <input type="date" id="filter-fecha-desde" class="filter-input">
    </div>
    <div class="filter-group">
      <label class="filter-label">Fecha hasta</label>
      <input type="date" id="filter-fecha-hasta" class="filter-input">
    </div>
    <div class="filter-group" style="display: flex; align-items: flex-end; gap: 0.5rem;">
      <button class="btn" onclick="limpiarFiltros()" style="background: var(--gray-400);">Limpiar</button>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; gap: 1rem;">
    <div class="stats" style="flex: 1;">
      <div class="stat-card">
        <div class="stat-label">Total respuestas</div>
        <div class="stat-value" id="stat-total">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Últimas 24h</div>
        <div class="stat-value" id="stat-recent">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Usuarios únicos</div>
        <div class="stat-value" id="stat-users">-</div>
      </div>
    </div>
    <button class="btn" onclick="exportarCSV()" style="white-space: nowrap; align-self: center;">📊 Exportar a CSV</button>
  </div>

  <div class="table-wrapper">
    <table id="respuestas-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Formulario</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Respuestas</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="5" class="loading">Cargando respuestas...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal para ver respuestas completas -->
<div class="modal" id="json-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Respuestas completas</h2>
      <div>
        <button class="export-btn" onclick="exportarRespuesta()">📥 Exportar JSON</button>
        <button class="close-btn" onclick="cerrarModal()">×</button>
      </div>
    </div>
    <div id="json-content"></div>
  </div>
</div>

<!-- Cargar Supabase y lógica -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/config.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//                        AUTHENTICATION CHECK (SERVER-SIDE)
// ═══════════════════════════════════════════════════════════════════════════

// Detectar modo desarrollo local
const isLocalDev = window.location.hostname === 'localhost' ||
                  window.location.hostname === '127.0.0.1' ||
                  window.location.protocol === 'file:';

async function checkAuthentication() {
  try {
    // ⚠️ MODO DESARROLLO LOCAL
    if (isLocalDev) {
      console.warn('⚠️ Modo desarrollo local - verificación en cliente');
      console.warn('💡 Para producción, usa: vercel dev');

      const session = localStorage.getItem('admin_session_dev');
      if (!session) {
        console.warn('⚠️ No hay sesión dev. Redirigiendo a login...');
        window.location.href = '/admin/login';
        return false;
      }

      const data = JSON.parse(session);

      // Verificar expiración (24 horas)
      const maxAge = 24 * 60 * 60 * 1000;
      if (Date.now() - data.timestamp > maxAge) {
        console.warn('⚠️ Sesión dev expirada');
        localStorage.removeItem('admin_session_dev');
        window.location.href = '/admin/login';
        return false;
      }

      console.log('✅ Dev session:', data.email);

      // Agregar info del usuario al header
      const header = document.querySelector('header');
      const userInfo = document.createElement('div');
      userInfo.style.cssText = 'display: flex; align-items: center; gap: 0.75rem;';
      userInfo.innerHTML = `
        <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7);">${data.name}</span>
        <img src="${data.picture}" alt="${data.name}" style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);">
        <button onclick="logout()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-family: inherit;">Cerrar sesión</button>
      `;
      header.appendChild(userInfo);

      return true;
    }

    // ✅ MODO PRODUCCIÓN: VERIFICAR SESIÓN EN EL SERVIDOR (cookie httpOnly)
    const response = await fetch('/api/auth/verify', {
      credentials: 'include' // Incluir cookies
    });

    const data = await response.json();

    if (!response.ok || !data.authenticated) {
      console.warn('⚠️ No hay sesión válida. Redirigiendo a login...');
      window.location.href = '/admin/login';
      return false;
    }

    console.log('✅ Autenticado como:', data.user.email);

    // Agregar info del usuario al header
    const header = document.querySelector('header');
    const userInfo = document.createElement('div');
    userInfo.style.cssText = 'display: flex; align-items: center; gap: 0.75rem;';
    userInfo.innerHTML = `
      <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7);">${data.user.name}</span>
      <img src="${data.user.picture}" alt="${data.user.name}" style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);">
      <button onclick="logout()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-family: inherit;">Cerrar sesión</button>
    `;
    header.appendChild(userInfo);

    return true;

  } catch (error) {
    console.error('❌ Error verificando sesión:', error);
    window.location.href = '/admin/login';
    return false;
  }
}

async function logout() {
  try {
    // ⚠️ MODO DESARROLLO LOCAL
    if (isLocalDev) {
      console.log('🔓 Cerrando sesión dev...');
      localStorage.removeItem('admin_session_dev');
      localStorage.removeItem('admin_user_info');
      window.location.href = '/admin/login';
      return;
    }

    // ✅ MODO PRODUCCIÓN: CERRAR SESIÓN EN EL SERVIDOR (eliminar cookie httpOnly)
    await fetch('/api/auth/logout', {
      method: 'POST',
      credentials: 'include'
    });

    // Limpiar localStorage (solo info de UI)
    localStorage.removeItem('admin_user_info');

    window.location.href = '/admin/login';

  } catch (error) {
    console.error('❌ Error en logout:', error);
    // Redirigir de todas formas
    window.location.href = '/admin/login';
  }
}

// Detectar bucle de redirección en el dashboard
let dashboardRedirectCount = parseInt(sessionStorage.getItem('dashboard_redirect_count') || '0');
if (dashboardRedirectCount > 3) {
  console.error('❌ BUCLE DE REDIRECCIÓN DETECTADO EN DASHBOARD');
  alert('Se detectó un bucle de redirección. Limpiando localStorage y redirigiendo al login...');
  localStorage.clear();
  sessionStorage.clear();
  window.location.href = '/admin/login';
  throw new Error('Loop detected');
}
sessionStorage.setItem('dashboard_redirect_count', String(dashboardRedirectCount + 1));

// Limpiar el contador después de 5 segundos (significa que cargó correctamente)
setTimeout(() => {
  sessionStorage.removeItem('dashboard_redirect_count');
}, 5000);

// Check authentication before loading data (async IIFE)
(async function() {
  const authenticated = await checkAuthentication();
  if (!authenticated) {
    throw new Error('Authentication required');
  }

  // Una vez autenticado, cargar los datos
  cargarRespuestas();
})();

// ═══════════════════════════════════════════════════════════════════════════

// ✅ YA NO NECESITAMOS cliente Supabase directo - usamos API autenticada
// const supabaseAdmin = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

let allRespuestas = [];
let currentRespuesta = null;

// ✅ Cargar respuestas desde API autenticada (servidor verifica sesión)
async function cargarRespuestas() {
  try {
    // ⚠️ MODO DESARROLLO LOCAL: Usar Supabase directo
    if (isLocalDev) {
      console.warn('⚠️ Modo dev: Cargando datos desde Supabase directo');
      console.warn('💡 Para producción, usa: vercel dev');

      // Cargar Supabase config
      await loadScript('/api/config');

      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
        throw new Error('Supabase no configurado en /api/config');
      }

      // Crear cliente Supabase
      const supabase = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

      const { data, error } = await supabase
        .from('respuestas_formularios')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      allRespuestas = data;
      renderizarTabla(data);
      actualizarEstadisticas(data);
      return;
    }

    // ✅ MODO PRODUCCIÓN: API autenticada
    const response = await fetch('/api/admin/respuestas', {
      credentials: 'include' // Incluir cookies de sesión
    });

    if (!response.ok) {
      if (response.status === 401) {
        // Sesión expirada
        console.warn('⚠️ Sesión expirada. Redirigiendo a login...');
        window.location.href = '/admin/login';
        return;
      }
      throw new Error(`Error ${response.status}: ${response.statusText}`);
    }

    const result = await response.json();

    if (!result.success || !result.data) {
      throw new Error('Respuesta inválida del servidor');
    }

    allRespuestas = result.data;
    renderizarTabla(result.data);
    actualizarEstadisticas(result.data);

  } catch (error) {
    console.error('Error al cargar respuestas:', error);
    document.getElementById('table-body').innerHTML = `
      <tr>
        <td colspan="5" class="empty-state">
          ❌ Error al cargar datos: ${error.message}
        </td>
      </tr>
    `;
  }
}

// Helper para cargar scripts dinámicamente
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// Renderizar tabla
function renderizarTabla(respuestas) {
  const tbody = document.getElementById('table-body');

  if (!respuestas || respuestas.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty-state">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;">No hay respuestas aún</p>
          <p style="color: var(--gray-400);">Las respuestas aparecerán aquí cuando los usuarios completen los formularios</p>
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = respuestas.map(r => {
    const fecha = new Date(r.created_at).toLocaleString('es-AR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });

    const badgeClass = `badge-${r.formulario_id.split('_')[1] || r.formulario_id}`;
    const nombreFormulario = {
      // Formularios antiguos (Assistify)
      'diagnostico_paso1': 'Recurso gratuito negocios – Paso 1',
      'diagnostico_paso2': 'Recurso gratuito negocios – Paso 2',
      'operaciones_saludables': 'Recurso gratuito OS',
      // Formularios nuevos (Entregables)
      'diagnostico_financiero': 'Diagnóstico Financiero',
      'diagnostico_roles': 'Diagnóstico de Roles',
      'inventario_semanal': 'Inventario Semanal',
      'diagnostico_delegacion': 'Diagnóstico de Delegación'
    }[r.formulario_id] || r.formulario_id;

    const numRespuestas = Object.keys(r.respuestas || {}).length;

    return `
      <tr>
        <td>${fecha}</td>
        <td><span class="badge ${badgeClass}">${nombreFormulario}</span></td>
        <td><strong>${r.nombre}</strong></td>
        <td style="color: var(--gray-600); font-size: 0.85rem;">${r.email}</td>
        <td>
          <button class="view-btn" onclick='verRespuesta(${JSON.stringify(r).replace(/'/g, "\\'")})'>${numRespuestas} respuestas</button>
        </td>
      </tr>
    `;
  }).join('');
}

// Actualizar estadísticas
function actualizarEstadisticas(respuestas) {
  document.getElementById('stat-total').textContent = respuestas.length;

  const hace24h = new Date(Date.now() - 24 * 60 * 60 * 1000);
  const recientes = respuestas.filter(r => new Date(r.created_at) > hace24h);
  document.getElementById('stat-recent').textContent = recientes.length;

  const emailsUnicos = new Set(respuestas.map(r => r.email));
  document.getElementById('stat-users').textContent = emailsUnicos.size;
}

// Aplicar filtros
function aplicarFiltros() {
  const nombreFiltro = document.getElementById('filter-nombre').value.toLowerCase();
  const emailFiltro = document.getElementById('filter-email').value.toLowerCase();
  const tipoFiltro = document.getElementById('filter-tipo').value;
  const fechaDesde = document.getElementById('filter-fecha-desde').value;
  const fechaHasta = document.getElementById('filter-fecha-hasta').value;

  const filtradas = allRespuestas.filter(r => {
    const matchNombre = !nombreFiltro || r.nombre.toLowerCase().includes(nombreFiltro);
    const matchEmail = !emailFiltro || r.email.toLowerCase().includes(emailFiltro);
    const matchTipo = !tipoFiltro || r.formulario_id === tipoFiltro;

    // Filtro de fecha
    let matchFecha = true;
    const fechaRespuesta = new Date(r.created_at);
    fechaRespuesta.setHours(0, 0, 0, 0);

    if (fechaDesde) {
      const desde = new Date(fechaDesde);
      desde.setHours(0, 0, 0, 0);
      matchFecha = matchFecha && fechaRespuesta >= desde;
    }

    if (fechaHasta) {
      const hasta = new Date(fechaHasta);
      hasta.setHours(23, 59, 59, 999);
      matchFecha = matchFecha && fechaRespuesta <= hasta;
    }

    return matchNombre && matchEmail && matchTipo && matchFecha;
  });

  renderizarTabla(filtradas);
  actualizarEstadisticas(filtradas);
}

// Limpiar filtros
function limpiarFiltros() {
  document.getElementById('filter-nombre').value = '';
  document.getElementById('filter-email').value = '';
  document.getElementById('filter-tipo').value = '';
  document.getElementById('filter-fecha-desde').value = '';
  document.getElementById('filter-fecha-hasta').value = '';
  aplicarFiltros();
}

// Ver respuesta completa en modal
function verRespuesta(respuesta) {
  currentRespuesta = respuesta;
  const modal = document.getElementById('json-modal');
  const content = document.getElementById('json-content');
  const title = document.getElementById('modal-title');

  // Actualizar título
  const nombreFormulario = {
    'diagnostico_paso1': 'Recurso gratuito negocios – Paso 1',
    'diagnostico_paso2': 'Recurso gratuito negocios – Paso 2',
    'operaciones_saludables': 'Recurso gratuito OS',
    'diagnostico_financiero': 'Diagnóstico Financiero',
    'diagnostico_roles': 'Diagnóstico de Roles',
    'inventario_semanal': 'Inventario Semanal',
    'diagnostico_delegacion': 'Diagnóstico de Delegación'
  }[respuesta.formulario_id] || respuesta.formulario_id;

  title.textContent = `${nombreFormulario} — ${respuesta.nombre}`;

  // Formatear respuestas de manera legible
  let html = '<div class="answer-grid">';

  for (const [key, value] of Object.entries(respuesta.respuestas || {})) {
    // Formatear la clave (convertir snake_case o camelCase a título)
    const label = key
      .replace(/_/g, ' ')
      .replace(/([A-Z])/g, ' $1')
      .replace(/^./, str => str.toUpperCase())
      .trim();

    // Formatear el valor de manera visual
    let displayValue = formatearValor(value);

    html += `
      <div class="answer-item">
        <div class="answer-label">${label}</div>
        <div class="answer-value">${displayValue}</div>
      </div>
    `;
  }

  html += '</div>';

  // Agregar metadata
  const fecha = new Date(respuesta.created_at).toLocaleString('es-AR', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  html += `
    <div class="metadata-section">
      <div class="metadata-title">📋 Información del envío</div>
      <div class="answer-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="answer-item">
          <div class="answer-label">Email</div>
          <div class="answer-value">${respuesta.email}</div>
        </div>
        <div class="answer-item">
          <div class="answer-label">Fecha de envío</div>
          <div class="answer-value">${fecha}</div>
        </div>
        <div class="answer-item">
          <div class="answer-label">ID de respuesta</div>
          <div class="answer-value" style="font-family: monospace; font-size: 0.8rem;">${respuesta.id}</div>
        </div>
      </div>
    </div>
  `;

  content.innerHTML = html;
  modal.classList.add('active');
}

// Formatear valores de manera visual y legible
function formatearValor(value) {
  // Valores vacíos
  if (value === null || value === undefined || value === '') {
    return '<em style="color: var(--gray-400);">Sin respuesta</em>';
  }

  // Booleanos
  if (typeof value === 'boolean') {
    return value
      ? '<span style="color: var(--teal); font-weight: 600;">✓ Sí</span>'
      : '<span style="color: var(--gray-400);">✗ No</span>';
  }

  // Números
  if (typeof value === 'number') {
    return `<strong>${value.toLocaleString('es-AR')}</strong>`;
  }

  // Arrays
  if (Array.isArray(value)) {
    if (value.length === 0) {
      return '<em style="color: var(--gray-400);">Lista vacía</em>';
    }

    // Si son strings simples, mostrar como lista con bullets
    if (value.every(v => typeof v === 'string' || typeof v === 'number')) {
      return '<ul style="margin: 0.5rem 0; padding-left: 1.5rem; line-height: 1.8;">' +
        value.map(v => `<li>${v}</li>`).join('') +
        '</ul>';
    }

    // Si son objetos, mostrar cada uno en una tarjeta
    return '<div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">' +
      value.map((item, idx) => {
        if (typeof item === 'object' && item !== null) {
          const entries = Object.entries(item)
            .map(([k, v]) => {
              const label = k.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim();
              return `<div style="margin-bottom: 0.25rem;"><strong>${label}:</strong> ${formatearValor(v)}</div>`;
            })
            .join('');

          return `<div style="background: white; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--gray-200);">
            <div style="font-weight: 600; color: var(--navy); margin-bottom: 0.5rem;">Item ${idx + 1}</div>
            ${entries}
          </div>`;
        }
        return `<div>• ${item}</div>`;
      }).join('') +
      '</div>';
  }

  // Objetos
  if (typeof value === 'object' && value !== null) {
    const entries = Object.entries(value)
      .map(([k, v]) => {
        const label = k.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim();
        return `<div style="margin-bottom: 0.5rem;">
          <span style="font-weight: 600; color: var(--navy);">${label}:</span>
          <span>${formatearValor(v)}</span>
        </div>`;
      })
      .join('');

    return `<div style="background: white; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--gray-200); margin-top: 0.5rem;">
      ${entries}
    </div>`;
  }

  // Strings - detectar URLs, emails, números de teléfono
  if (typeof value === 'string') {
    // URL
    if (value.match(/^https?:\/\//)) {
      return `<a href="${value}" target="_blank" style="color: var(--teal); text-decoration: none; font-weight: 500;">
        🔗 ${value}
      </a>`;
    }

    // Email
    if (value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
      return `<a href="mailto:${value}" style="color: var(--teal); text-decoration: none; font-weight: 500;">
        ✉️ ${value}
      </a>`;
    }

    // Teléfono
    if (value.match(/^[\d\s\-\+\(\)]+$/) && value.replace(/\D/g, '').length >= 8) {
      return `<a href="tel:${value}" style="color: var(--navy); font-weight: 500;">
        📞 ${value}
      </a>`;
    }

    // Fecha (detectar formato ISO)
    if (value.match(/^\d{4}-\d{2}-\d{2}/)) {
      try {
        const date = new Date(value);
        if (!isNaN(date.getTime())) {
          return `<span style="font-weight: 500;">📅 ${date.toLocaleString('es-AR', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: date.toISOString().includes('T') ? '2-digit' : undefined,
            minute: date.toISOString().includes('T') ? '2-digit' : undefined
          })}</span>`;
        }
      } catch (e) {}
    }

    // Texto largo (más de 100 caracteres) - agregar saltos de línea
    if (value.length > 100) {
      return `<div style="line-height: 1.6; white-space: pre-wrap;">${value}</div>`;
    }

    // Texto normal
    return value;
  }

  // Fallback
  return String(value);
}

function cerrarModal() {
  document.getElementById('json-modal').classList.remove('active');
  currentRespuesta = null;
}

// Exportar respuesta como JSON
function exportarRespuesta() {
  if (!currentRespuesta) return;

  const dataStr = JSON.stringify(currentRespuesta, null, 2);
  const dataBlob = new Blob([dataStr], { type: 'application/json' });

  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `respuesta-${currentRespuesta.formulario_id}-${currentRespuesta.id}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Exportar todas las respuestas filtradas a CSV
function exportarCSV() {
  const nombreFiltro = document.getElementById('filter-nombre').value.toLowerCase();
  const emailFiltro = document.getElementById('filter-email').value.toLowerCase();
  const tipoFiltro = document.getElementById('filter-tipo').value;
  const fechaDesde = document.getElementById('filter-fecha-desde').value;
  const fechaHasta = document.getElementById('filter-fecha-hasta').value;

  const filtradas = allRespuestas.filter(r => {
    const matchNombre = !nombreFiltro || r.nombre.toLowerCase().includes(nombreFiltro);
    const matchEmail = !emailFiltro || r.email.toLowerCase().includes(emailFiltro);
    const matchTipo = !tipoFiltro || r.formulario_id === tipoFiltro;

    let matchFecha = true;
    const fechaRespuesta = new Date(r.created_at);
    fechaRespuesta.setHours(0, 0, 0, 0);

    if (fechaDesde) {
      const desde = new Date(fechaDesde);
      desde.setHours(0, 0, 0, 0);
      matchFecha = matchFecha && fechaRespuesta >= desde;
    }

    if (fechaHasta) {
      const hasta = new Date(fechaHasta);
      hasta.setHours(23, 59, 59, 999);
      matchFecha = matchFecha && fechaRespuesta <= hasta;
    }

    return matchNombre && matchEmail && matchTipo && matchFecha;
  });

  if (filtradas.length === 0) {
    alert('No hay respuestas para exportar con los filtros actuales.');
    return;
  }

  // Obtener todas las columnas únicas de las respuestas
  const allKeys = new Set();
  filtradas.forEach(r => {
    Object.keys(r.respuestas || {}).forEach(key => allKeys.add(key));
  });

  // Crear encabezados
  const headers = ['Fecha', 'Formulario', 'Nombre', 'Email', ...Array.from(allKeys)];

  // Crear filas
  const rows = filtradas.map(r => {
    const nombreFormulario = {
      'diagnostico_paso1': 'Recurso gratuito negocios – Paso 1',
      'diagnostico_paso2': 'Recurso gratuito negocios – Paso 2',
      'operaciones_saludables': 'Recurso gratuito OS',
      'diagnostico_financiero': 'Diagnóstico Financiero',
      'diagnostico_roles': 'Diagnóstico de Roles',
      'inventario_semanal': 'Inventario Semanal',
      'diagnostico_delegacion': 'Diagnóstico de Delegación'
    }[r.formulario_id] || r.formulario_id;

    const fecha = new Date(r.created_at).toLocaleString('es-AR');

    const row = [
      fecha,
      nombreFormulario,
      r.nombre,
      r.email
    ];

    // Agregar valores de respuestas
    allKeys.forEach(key => {
      const value = r.respuestas[key];
      if (typeof value === 'object' && value !== null) {
        row.push(JSON.stringify(value));
      } else if (typeof value === 'boolean') {
        row.push(value ? 'Sí' : 'No');
      } else {
        row.push(value || '');
      }
    });

    return row;
  });

  // Convertir a CSV
  const csvContent = [
    headers.map(h => `"${h}"`).join(','),
    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
  ].join('\n');

  // Descargar archivo
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;

  const fecha = new Date().toISOString().split('T')[0];
  link.download = `respuestas-formularios-${fecha}.csv`;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Event listeners
document.getElementById('filter-nombre').addEventListener('input', aplicarFiltros);
document.getElementById('filter-email').addEventListener('input', aplicarFiltros);
document.getElementById('filter-tipo').addEventListener('change', aplicarFiltros);
document.getElementById('filter-fecha-desde').addEventListener('change', aplicarFiltros);
document.getElementById('filter-fecha-hasta').addEventListener('change', aplicarFiltros);

// Cerrar modal con ESC o click fuera
document.getElementById('json-modal').addEventListener('click', (e) => {
  if (e.target.id === 'json-modal') cerrarModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModal();
});

// Iniciar carga
cargarRespuestas();

// Recargar cada 30 segundos
setInterval(cargarRespuestas, 30000);
</script>
